<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퇴근애즈</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="퇴근애즈">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff; --soft:#f5f6f7; --soft2:#eef0f2; --ink:#0d0f12; --ink2:#2b3036; --mute:#6a717b; --line:#e7e9ec;
  --accent:#ff5a1f; --accent-ink:#d9480f; --accent-soft:#fff2ec;
  --blue:#2563eb; --blue-soft:#eef3ff; --green:#15803d; --green-soft:#ecf8f0; --red:#dc2626; --red-soft:#fdeeee;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Pretendard",system-ui,sans-serif;
  --r:14px; --nav:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--nav) + var(--safe-b) + 16px)}
.app.nonav{padding-bottom:24px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;min-height:56px}
.top .logo{width:28px;height:auto}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.top .sub{font-size:12px;color:var(--mute);font-weight:400;margin-left:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:active{background:var(--soft)}
.mode{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.mode.cloud{background:var(--green-soft);color:var(--green);border-color:#cfeedd}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .in{max-width:520px;margin:0 auto;display:flex;height:var(--nav)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);cursor:pointer;position:relative}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on svg{color:var(--accent)}
.nav .dot{position:absolute;top:9px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* layout */
.page{padding:16px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec h2{font-size:15px;margin:0;font-weight:700}
.sec .more{font-size:13px;color:var(--mute);background:none;border:0;cursor:pointer;padding:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--soft)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--mute)}
.small{font-size:13px}
.xs{font-size:12px}
.bold{font-weight:700}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.empty{text-align:center;color:var(--mute);padding:36px 16px;font-size:14px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}

/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--soft);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--mute)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.4px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--mute);margin-left:2px}
.kpi .d{font-size:12px;margin-top:2px}
.kpi.hl{background:var(--accent-soft)}
.kpi.hl .v{color:var(--accent-ink)}
.up{color:var(--green)}.down{color:var(--red)}

/* badge, chip */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.b-wait{background:var(--accent-soft);color:var(--accent-ink)}
.b-doing{background:var(--blue-soft);color:var(--blue)}
.b-done{background:var(--green-soft);color:var(--green)}
.b-stop{background:var(--soft2);color:var(--mute)}
.b-red{background:var(--red-soft);color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.chip .n{margin-left:4px;opacity:.7}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:var(--soft)}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn.lg{min-height:54px;font-size:16px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}

/* forms */
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink2)}
.f label .req{color:var(--accent)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:15px;outline:none;min-height:46px}
.in:focus{border-color:var(--ink)}
textarea.in{min-height:96px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);margin-top:5px}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer}
.item+.item{margin-top:8px}
.item:active{background:var(--soft)}
.av{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--ink2);flex:none;font-size:15px}
.av.o{background:var(--accent-soft);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 10px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;word-break:break-all}

/* photos */
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);cursor:pointer}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(13,15,18,.72);color:#fff;display:grid;place-items:center;cursor:pointer}
.thumbs .t .more{position:absolute;inset:0;background:rgba(13,15,18,.55);color:#fff;display:grid;place-items:center;font-weight:700}
.f label.picker,.picker{display:flex;font-weight:400;margin:0;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #cfd3d8;border-radius:var(--r);padding:26px 12px;color:var(--mute);cursor:pointer;background:var(--soft);text-align:center}
.picker svg{width:30px;height:30px;color:var(--accent)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.note.o{background:var(--accent-soft)}
.note .h{font-size:12px;font-weight:700;color:var(--accent-ink);margin-bottom:2px}

/* hero */
.hero{padding:22px 18px;border-radius:18px;background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero .s{font-size:13px;color:#b8bec6}
.hero .t{font-size:21px;font-weight:700;margin-top:4px;letter-spacing:-.4px;line-height:1.35}
.hero .t em{font-style:normal;color:#ff8a5c}
.hero .btn{margin-top:16px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,90,31,.18)}

/* funnel */
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar+.bar{margin-top:8px}
.bar .l{width:56px;color:var(--mute);flex:none}
.bar .tr{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .fi{height:100%;background:var(--accent);border-radius:5px}
.bar .n{width:24px;text-align:right;font-weight:700}

/* landing */
.land{min-height:100vh;display:flex;flex-direction:column;padding:calc(48px + var(--safe-t)) 24px 28px;background:#fff}
.land .brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px;flex:1;justify-content:center}
.land .brand img{width:64px}
.land h1{font-size:30px;margin:0;letter-spacing:-.8px}
.land p{margin:0;color:var(--mute);font-size:15px}
.land .tag{font-size:19px;font-weight:700;color:var(--ink);line-height:1.45;letter-spacing:-.3px}
.land .tag em{font-style:normal;color:var(--accent)}
.land .acts{display:flex;flex-direction:column;gap:10px}
.linkbtn{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}

/* overlay sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(13,15,18,.45);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h3{flex:1;margin:0;font-size:17px}
.sheet .sb{padding:16px 18px;overflow-y:auto}
.sheet .sf{padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .sf .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer .vh{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(10px + var(--safe-t)) 10px 10px 16px}
.viewer .vh .iconbtn{color:#fff}
.viewer .vi{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.viewer .vi img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.viewer .nv.p{left:0;border-radius:0 12px 12px 0}.viewer .nv.n{right:0;border-radius:12px 0 0 12px}
.viewer .vf{display:flex;gap:8px;padding:12px 16px calc(14px + var(--safe-b))}
.viewer .vf .btn{flex:1;background:#1c1f24;border-color:#1c1f24;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 18px);transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:fd .2s}
.loading{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.75);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;font-size:14px;color:var(--ink2)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner button{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.code{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:3px}
.done-wrap{text-align:center;padding:48px 20px}
.done-wrap .ck{width:64px;height:64px;border-radius:32px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 16px}
.done-wrap .ck svg{width:34px;height:34px;stroke-width:2.4}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typegrid .chip{text-align:center;padding:11px 8px;border-radius:12px}
.toggle{width:50px;height:30px;border-radius:15px;background:#d6d9dd;border:0;position:relative;cursor:pointer;flex:none;transition:.15s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on:after{left:23px}
.over{color:var(--red);font-weight:700}
.divider{height:1px;background:var(--line);margin:14px 0}
</style>
<script src="config.js" onerror="void 0"></script>

const Auth = {
  get s() { return LS.get('tga_sess', null); },
  set s(v) { v ? LS.set('tga_sess', v) : LS.del('tga_sess'); },
  async signIn(email, password) {
    const r = await fetch(base() + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || '로그인 실패: 이메일/비밀번호를 확인하세요.');
    this.s = { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000, email: j.user && j.user.email };
  },
  async token() {
    const s = this.s; if (!s) return null;
    if (Date.now() < s.exp) return s.at;
    const r = await fetch(base() + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.rt }) });
    if (!r.ok) { this.s = null; return null; }
    const j = await r.json(); this.s = { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 60) * 1000, email: s.email }; return j.access_token;
  },
  out() { this.s = null; }
};
const Cloud = {
  async req(path, { method = 'GET', body, headers = {}, anon = false, raw = false } = {}) {
    const h = { apikey: CFG.key, ...headers };
    const tok = anon ? null : await Auth.token();
    h.Authorization = 'Bearer ' + (tok || CFG.key);
    if (body !== undefined && !raw) h['Content-Type'] = 'application/json';
    const r = await fetch(base() + path, { method, headers: h, body: body === undefined ? undefined : (raw ? body : JSON.stringify(body)) });
    if (!r.ok) {
      let m = ''; try { const j = await r.json(); m = j.message || j.error || j.msg || ''; } catch (e) {}
      if (r.status === 401 && !anon) { m = '로그인이 만료되었습니다. 다시 로그인해주세요.'; }
      throw new Error(m || ('서버 요청 실패 (' + r.status + ')'));
    }
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  list(t) { return this.req(`/rest/v1/${t}?select=*&order=created_at.desc`); },
  async insert(t, row) { const r = await this.req(`/rest/v1/${t}`, { method: 'POST', body: row, headers: { Prefer: 'return=representation' } }); return r && r[0]; },
  async update(t, id, patch) { const r = await this.req(`/rest/v1/${t}?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', body: patch, headers: { Prefer: 'return=representation' } }); return r && r[0]; },
  remove(t, id) { return this.req(`/rest/v1/${t}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' }); },
  saveReport(row) { return this.req(`/rest/v1/reports?on_conflict=client_id,month`, { method: 'POST', body: row, headers: { Prefer: 'resolution=merge-duplicates,return=representation' } }); },
  async upload(blob, anon) {
    const path = `${ymNow()}/${uid()}.jpg`;
    await this.req(`/storage/v1/object/photos/${path}`, { method: 'POST', body: blob, raw: true, anon, headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'false' } });
    return `${base()}/storage/v1/object/public/photos/${path}`;
  },
  rpc(fn, args) { return this.req(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args, anon: true }); },
  clientLogin(code) { return this.rpc('client_login', { p_code: code }); },
  async clientRequests(code) { return (await this.rpc('client_requests', { p_code: code })) || []; },
  async clientReports(code) { return (await this.rpc('client_reports', { p_code: code })) || []; },
  clientSubmit(code, type, message, photos) { return this.rpc('client_submit', { p_code: code, p_type: type, p_message: message, p_photos: photos }); }
};
const DB = () => (isCloud() ? Cloud : Demo);

let toastT;
function toast(m) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); }
function loading(on, msg = '잠시만요') { let l = $('.loading'); if (!on) { l && l.remove(); return; } if (!l) { l = document.createElement('div'); l.className = 'loading'; document.body.appendChild(l); } l.innerHTML = `<div class="spin"></div><div>${esc(msg)}</div>`; }
async function guard(fn, msg) { try { if (msg) loading(true, msg); return await fn(); } catch (e) { console.error(e); toast(e.message || '오류가 발생했습니다.'); } finally { if (msg) loading(false); } }

let ovStack = [];
function openOverlay(el) { document.body.appendChild(el); ovStack.push(el); document.body.style.overflow = 'hidden'; history.pushState(Object.assign({}, history.state, { ov: ovStack.length }), ''); }
function popOverlay() { const el = ovStack.pop(); if (el) el.remove(); if (!ovStack.length) document.body.style.overflow = ''; return !!el; }
let afterPop = null;
function closeTop() { if (ovStack.length) history.back(); }
function closeThen(fn) { afterPop = fn; closeTop(); }
function sheet(title, body, { ok = '저장', onOk, extra = '', cancel = '닫기' } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sheet" role="dialog"><div class="sh"><h3>${esc(title)}</h3><button class="iconbtn" data-x>${ic('x')}</button></div>
    <form class="sb" novalidate>${body}</form>
    ${onOk ? `<div class="sf">${extra}<button class="btn" type="button" data-x>${esc(cancel)}</button><button class="btn pri" type="button" data-ok>${esc(ok)}</button></div>` : ''}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) closeTop(); });
  const form = ov.querySelector('form');
  form.addEventListener('submit', e => { e.preventDefault(); ov.querySelector('[data-ok]') && ov.querySelector('[data-ok]').click(); });
  if (onOk) ov.querySelector('[data-ok]').addEventListener('click', async () => {
    const fd = Object.fromEntries(new FormData(form).entries());
    for (const el of form.querySelectorAll('[required]')) if (!String(el.value).trim()) { el.focus(); toast((el.dataset.label || '필수 항목') + '을(를) 입력해주세요.'); return; }
    let ok = true; loading(true, '저장 중');
    try { if ((await onOk(fd, form)) === false) ok = false; } catch (err) { ok = false; console.error(err); toast(err.message || '오류가 발생했습니다.'); } finally { loading(false); }
    if (ok) closeTop();
  });
  openOverlay(ov); return ov;
}
function confirmBox(msg, okLabel = '확인') { return new Promise(res => { let done = false; const ov = sheet('확인', `<p style="margin:0 0 6px">${esc(msg)}</p>`, { ok: okLabel, cancel: '취소', onOk: () => { done = true; res(true); } }); const obs = new MutationObserver(() => { if (!document.body.contains(ov)) { obs.disconnect(); if (!done) res(false); } }); obs.observe(document.body, { childList: true }); }); }

function viewer(urls, idx = 0) {
  const ov = document.createElement('div'); ov.className = 'viewer';
  const draw = () => {
    ov.innerHTML = `<div class="vh"><span class="small">${idx + 1} / ${urls.length}</span><button class="iconbtn" data-x>${ic('x')}</button></div>
    <div class="vi"><img src="${esc(urls[idx])}" alt="">${urls.length > 1 ? `<button class="nv p" data-p>${ic('left')}</button><button class="nv n" data-n>${ic('right')}</button>` : ''}</div>
    <div class="vf"><button class="btn" data-dl>${ic('down', 'sm')}이 사진 저장</button><button class="btn" data-sh>${ic('share', 'sm')}전체 공유</button></div>`;
  };
  draw();
  ov.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) return closeTop();
    if (e.target.closest('[data-p]')) { idx = (idx - 1 + urls.length) % urls.length; draw(); }
    if (e.target.closest('[data-n]')) { idx = (idx + 1) % urls.length; draw(); }
    if (e.target.closest('[data-dl]')) downloadPhotos([urls[idx]]);
    if (e.target.closest('[data-sh]')) sharePhotos(urls);
  });
  let sx = null; ov.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  ov.addEventListener('touchend', e => { if (sx == null || urls.length < 2) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) { idx = (idx + (dx < 0 ? 1 : -1) + urls.length) % urls.length; draw(); } sx = null; });
  openOverlay(ov);
}
async function toFiles(urls) { return Promise.all(urls.map(async (u, i) => { const b = await (await fetch(u)).blob(); return new File([b], `toegeunads_${Date.now()}_${i + 1}.jpg`, { type: b.type || 'image/jpeg' }); })); }
async function sharePhotos(urls) {
  if (!urls.length) return;
  await guard(async () => {
    const files = await toFiles(urls);
    if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files }); } catch (e) { if (e.name !== 'AbortError') throw e; } }
    else { toast('이 브라우저는 공유를 지원하지 않아 저장으로 대신합니다.'); downloadFiles(files); }
  }, '사진 준비 중');
}
async function downloadPhotos(urls) { await guard(async () => downloadFiles(await toFiles(urls)), '사진 준비 중'); }
function downloadFiles(files) { files.forEach((f, i) => setTimeout(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, i * 350)); }
function downloadText(name, text, type = 'application/json') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

async function compress(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('사진을 읽을 수 없습니다: ' + file.name)); im.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
async function shareText(title, text) {
  if (navigator.share) { try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('복사되었습니다. 카톡에 붙여넣기 하세요.'); } catch (e) { prompt('아래 내용을 복사하세요', text); }
}

/* ----- admin: home ----- */
function vAHome() {
  const d = S.data, ym = ymNow(), prev = ymAdd(ym, -1);
  const active = d.clients.filter(c => c.status === '진행중');
  const monthly = active.filter(c => c.plan !== '세팅(1회)');
  const expected = monthly.reduce((s, c) => s + (Number(c.fee) || 0), 0);
  const paid = d.payments.filter(p => p.month === ym).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const waiting = d.requests.filter(r => r.status !== '완료');
  const today = todayStr();
  const leadsDue = d.leads.filter(l => l.next_date && l.next_date <= today && !['계약', '보류'].includes(l.stage));
  const noReport = monthly.filter(c => !d.reports.find(r => r.client_id === c.id && r.month === prev) && (c.start_date || '') < ym);
  const dayNow = new Date().getDate();
  const payDue = monthly.filter(c => !paidThisMonth(c.id) && c.pay_day && c.pay_day - dayNow <= 5);
  const stageCnt = STAGES.map(s => [s, d.leads.filter(l => l.stage === s).length]);
  const maxN = Math.max(1, ...stageCnt.map(x => x[1]));
  const todo = [];
  waiting.slice(0, 4).forEach(r => { const c = clientById(r.client_id); todo.push(`<div class="item" data-act="tab" data-tab="req">${reqBadge(r.status)}<div class="grow"><div class="bold ellipsis">${esc(c ? c.name : '삭제된 고객')}</div><div class="xs muted ellipsis">${esc(r.type)} · ${rel(r.created_at)}</div></div>${ic('right', 'sm')}</div>`); });
  leadsDue.forEach(l => todo.push(`<div class="item" data-act="leadEdit" data-id="${l.id}"><span class="badge b-red">영업</span><div class="grow"><div class="bold ellipsis">${esc(l.name)}</div><div class="xs muted ellipsis">${esc(l.next_action || '다음 행동 미정')} · ${l.next_date < today ? '<span class="over">기한 지남</span>' : '오늘'}</div></div>${ic('right', 'sm')}</div>`));
  payDue.forEach(c => todo.push(`<div class="item" data-act="client" data-id="${c.id}"><span class="badge b-wait">입금</span><div class="grow"><div class="bold ellipsis">${esc(c.name)}</div><div class="xs muted">결제일 ${c.pay_day}일 · ${man(c.fee)} 미확인</div></div>${ic('right', 'sm')}</div>`));
  noReport.forEach(c => todo.push(`<div class="item" data-act="report" data-cid="${c.id}" data-month="${prev}"><span class="badge b-doing">리포트</span><div class="grow"><div class="bold ellipsis">${esc(c.name)}</div><div class="xs muted">${ymLabel(prev)} 리포트 미작성</div></div>${ic('right', 'sm')}</div>`));
  return `${header('퇴근애즈', { sub: '관리자', right: `${modeTag()}<button class="iconbtn" data-act="refresh" aria-label="새로고침">${ic('refresh')}</button>` })}
  <div class="page">
    <div class="kpis">
      <div class="kpi hl"><div class="l">${Number(ym.slice(5))}월 월관리 매출(예정)</div><div class="v">${man(expected)}</div><div class="d muted">입금 확인 ${man(paid)}</div></div>
      <div class="kpi"><div class="l">관리 중 고객사</div><div class="v">${active.length}<small>곳</small></div><div class="d muted">전체 ${d.clients.length}곳</div></div>
      <div class="kpi"><div class="l">처리 대기 요청</div><div class="v">${waiting.length}<small>건</small></div><div class="d muted">접수 ${waiting.filter(r => r.status === '접수').length} · 진행 ${waiting.filter(r => r.status === '진행중').length}</div></div>
      <div class="kpi"><div class="l">영업 리드</div><div class="v">${d.leads.filter(l => !['계약', '보류'].includes(l.stage)).length}<small>곳</small></div><div class="d muted">계약 ${d.leads.filter(l => l.stage === '계약').length}곳</div></div>
    </div>
    <div class="sec"><h2>오늘 할 일</h2><span class="xs muted">${todo.length}건</span></div>
    ${todo.length ? todo.join('') : `<div class="empty">밀린 일이 없습니다. 오늘은 칼퇴하세요.</div>`}
    <div class="sec"><h2>영업 단계</h2><button class="more" data-act="tab" data-tab="lead">전체 보기</button></div>
    <div class="card">${stageCnt.map(([s, n]) => `<div class="bar"><span class="l">${s}</span><div class="tr"><div class="fi" style="width:${n / maxN * 100}%;${s === '보류' ? 'background:#c4c8ce' : ''}"></div></div><span class="n">${n}</span></div>`).join('')}</div>
  </div>`;
}

function vCReports() {

/* ---------- render ---------- */
function render() {
  const root = $('#root');
  let html = '', nav = '', nonav = false;
  if (S.role === 'admin') {
    const w = S.data.requests.filter(r => r.status === '접수').length;
    nav = navBar([['home', '홈', 'home'], ['req', '요청함', 'inbox', w || ''], ['cli', '고객사', 'users'], ['lead', '영업', 'target'], ['set', '설정', 'set']]);
    if (!['home', 'req', 'cli', 'lead', 'set'].includes(S.tab)) S.tab = 'home';
    if (S.tab === 'cli' && S.sub) html = vAClientDetail(S.sub);
    else html = ({ home: vAHome, req: vARequests, cli: vAClients, lead: vALeads, set: vASettings }[S.tab] || vAHome)();
  } else if (S.role === 'client' && S.me) {
    if (!['home', 'send', 'hist', 'rep'].includes(S.tab)) S.tab = 'home';
    nav = navBar([['home', '홈', 'home'], ['send', '사진 보내기', 'camera'], ['hist', '요청 내역', 'list'], ['rep', '리포트', 'chart']]);
    html = ({ home: vCHome, send: vCSend, hist: vCHistory, rep: vCReports }[S.tab] || vCHome)();
    if (S.preview) html = `<div class="banner"><span>사장님 화면 미리보기 중</span><button data-act="endPreview">관리자로 돌아가기</button></div>` + html;
  } else {
    nonav = true;
    html = S.tab === 'code' ? vClientCode() : S.tab === 'login' ? vAdminLogin() : vLanding();
  }
  root.innerHTML = `<div class="app ${nonav ? 'nonav' : ''}">${html}</div>${nav}`;
  const ci = $('#codeForm input'); if (ci && S.codeHint) ci.value = S.codeHint;
}

  landClient() { go('code'); },
  landAdmin() { go('login'); },
  async adminDemo() { S.role = 'admin'; LS.set('tga_role', { role: 'admin' }); await refresh(); S.tab = 'home'; history.replaceState({ tab: 'home' }, ''); render(); },

      <div class="f"><label>Project URL</label><input class="in" name="url" placeholder="https://xxxx.supabase.co" value="${esc(CFG.url)}" autocomplete="off"></div>

          if (!r || !r.ok) throw new Error('연결 실패: URL·키를 확인하고, SQL 설정을 먼저 실행했는지 확인하세요.');
          LS.set('tga_cfg', { url, key });
        } else LS.set('tga_cfg', { url: '', key: '' });
        Auth.out(); LS.del('tga_role'); setTimeout(() => location.replace(appUrl()), 150);
      } });
  },

  /* admin - requests */

  async reqStatus(el) { await guard(() => DB().update('requests', el.dataset.id, { status: el.dataset.s }), '저장 중'); await refresh(true); },
  reqDone(el) {
    const r = S.data.requests.find(x => x.id === el.dataset.id); if (!r) return;

    sheet('완료 처리', `<div class="f"><label>사장님께 보낼 답변</label><textarea class="in" name="note" id="noteTa" placeholder="예) 네이버 소식 게시 완료했습니다.">${esc(r.admin_note || '')}</textarea></div>
      <div class="chips" style="flex-wrap:wrap">${presets.map(p => `<button type="button" class="chip" data-preset="${esc(p)}">${esc(p.replace(/ 완료했습니다\./, ''))}</button>`).join('')}</div>`,
      { ok: '완료로 저장', onOk: async fd => { await DB().update('requests', r.id, { status: '완료', admin_note: fd.note.trim(), done_at: new Date().toISOString() }); await loadAdmin(); render(); toast('완료 처리되었습니다.'); } })
      .addEventListener('click', e => { const b = e.target.closest('[data-preset]'); if (b) { const ta = document.getElementById('noteTa'); ta.value = b.dataset.preset; } });
  },
  shareReq(el) { const r = S.data.requests.find(x => x.id === el.dataset.id); if (r) sharePhotos(r.photos || []); },
  view(el) { const src = S.role === 'admin' ? S.data.requests : S.cReq; const r = src.find(x => x.id === el.dataset.rid); if (r) viewer(r.photos || [], Number(el.dataset.i)); },

  /* admin - clients */
  client(el) { go('cli', el.dataset.id); },
  clientNew(el, pre = {}) { clientForm(null, pre); },
  clientEdit(el) { clientForm(clientById(el.dataset.id)); },
  async clientDel(el) {

    await guard(() => DB().remove('clients', c.id), '삭제 중'); await loadAdmin(); history.back(); toast('삭제되었습니다.');
  },

    shareText('퇴근애즈 사진 보내기', `[퇴근애즈] ${c.name} 사장님, 안녕하세요.\n앞으로 퇴근 전 사진은 아래 링크로 보내주시면 됩니다.\n\n${inviteLink(c)}\n고객 코드: ${c.code}\n\n링크 열고 메뉴에서 '홈 화면에 추가'를 누르시면 앱처럼 쓰실 수 있습니다.`);
  },
  async payToggle(el) {

  },
  preview(el) {
    const c = clientById(el.dataset.id); if (!c) return;

  },
  async endPreview() { S.preview = false; S.role = 'admin'; S.me = null; await refresh(true); go('cli', S.data.clients.find(c => c.code === S.code)?.id || null); },
  report(el) { reportForm(el.dataset.cid, el.dataset.month); },

  /* admin - leads */
  leadFilter(el) { S.leadFilter = el.dataset.v; render(); },
  leadNew() { leadForm(null); },
  leadEdit(el) { leadForm(S.data.leads.find(l => l.id === el.dataset.id)); },
  async leadNext(el) { await guard(() => DB().update('leads', el.dataset.id, { stage: el.dataset.s }), '저장 중'); await refresh(true); toast(`${el.dataset.s} 단계로 이동했습니다.`); },
  leadConvert(el) { const l = S.data.leads.find(x => x.id === el.dataset.id); if (l) clientForm(null, { name: l.name, category: l.category, phone: l.contact, memo: l.memo, _lead: l.id }); },

  /* admin - settings */
  backup() { downloadText(`toegeunads_backup_${todayStr()}.json`, JSON.stringify({ app: 'toegeunads', ver: APP_VER, at: new Date().toISOString(), ...S.data }, null, 1)); },
  restore() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      await guard(async () => { const j = JSON.parse(await f.text()); if (!j.clients) throw new Error('백업 파일 형식이 아닙니다.'); Demo.save({ clients: j.clients, leads: j.leads || [], requests: j.requests || [], reports: j.reports || [], payments: j.payments || [] }); await loadAdmin(); render(); toast('불러오기 완료'); });
    };
    inp.click();
  },
  async clearSample() {
    if (!(await confirmBox('샘플 데이터를 모두 지울까요?', '지우기'))) return;
    const d = Demo.db(); const ids = d.clients.filter(c => c.name.startsWith('샘플')).map(c => c.id);
    d.clients = d.clients.filter(c => !ids.includes(c.id)); for (const k of ['requests', 'reports', 'payments']) d[k] = d[k].filter(x => !ids.includes(x.client_id));
    d.leads = d.leads.filter(l => !l.name.startsWith('샘플')); Demo.save(d); await loadAdmin(); render(); toast('샘플 데이터를 지웠습니다.');

    const ym = ymNow();

    S.data.clients.forEach(c => rows.push([c.name, c.category, c.plan, c.fee, c.pay_day, c.status, c.owner_name, c.phone, c.start_date, c.code, paidThisMonth(c.id) ? 'Y' : 'N', S.data.requests.filter(r => r.client_id === c.id && r.status !== '완료').length]));
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    downloadText(`퇴근애즈_고객사_${todayStr()}.csv`, csv, 'text/csv;charset=utf-8');
  },

  /* client */
  dtype(el) { S.draft.type = el.dataset.v; render(); },
  drm(el) { const i = Number(el.dataset.i); const f = S.draft.files[i]; if (f) URL.revokeObjectURL(f.url); S.draft.files.splice(i, 1); render(); },
  sendMore() { S.sent = false; render(); },
  repMonth(el) { S.repMonth = el.dataset.v; render(); },
  async submit() {
    const d = S.draft;
    if (!d.files.length && !d.message.trim()) { toast('사진이나 요청 메모를 넣어주세요.'); return; }
    const db = DB();
    const ok = await guard(async () => {
      const urls = [];
      for (let i = 0; i < d.files.length; i++) { loading(true, `사진 올리는 중 ${i + 1}/${d.files.length}`); urls.push(await db.upload(d.files[i].blob, true)); }
      loading(true, '접수 중');
      await db.clientSubmit(S.code, d.type, d.message.trim(), urls);
      return true;
    });
    loading(false);
    if (!ok) return;
    d.files.forEach(f => URL.revokeObjectURL(f.url));
    S.draft = { type: REQ_TYPES[0], message: '', files: [] }; S.sent = true;
    await refresh(true);
  }
};

function clientForm(c, pre = {}) {
  const v = Object.assign({ name: '', category: '요식업', plan: '월 관리', fee: 150000, pay_day: '', status: '진행중', owner_name: '', phone: '', start_date: todayStr(), memo: '' }, c || {}, pre);
  const ov = sheet(c ? '고객사 수정' : '고객사 추가', `
    <div class="f"><label>상호 <span class="req">*</span></label><input class="in" name="name" value="${esc(v.name)}" required data-label="상호"></div>
    <div class="f2"><div class="f"><label>업종</label><select class="in" name="category">${opt(CATEGORIES, v.category)}</select></div>
      <div class="f"><label>상태</label><select class="in" name="status">${opt(CLIENT_STATUS, v.status)}</select></div></div>
    <div class="f2"><div class="f"><label>요금제</label><select class="in" name="plan" id="planSel">${opt(PLANS.map(p => p.n), v.plan)}</select></div>
      <div class="f"><label>금액(원)</label><input class="in" name="fee" id="feeIn" type="number" inputmode="numeric" value="${esc(v.fee)}"></div></div>
    <div class="f2"><div class="f"><label>결제일(매월)</label><input class="in" name="pay_day" type="number" inputmode="numeric" min="1" max="31" placeholder="예) 10" value="${esc(v.pay_day)}"></div>
      <div class="f"><label>시작일</label><input class="in" name="start_date" type="date" value="${esc(v.start_date || '')}"></div></div>
    <div class="f2"><div class="f"><label>대표자</label><input class="in" name="owner_name" value="${esc(v.owner_name || '')}" placeholder="사장님 호칭"></div>
      <div class="f"><label>연락처</label><input class="in" name="phone" type="tel" inputmode="tel" value="${esc(v.phone || '')}"></div></div>
    <div class="f"><label>메모</label><textarea class="in" name="memo" placeholder="계정 정보 위치, 선호 톤, 주의사항 등">${esc(v.memo || '')}</textarea></div>`,
    { onOk: async fd => {
      const row = { name: fd.name.trim(), category: fd.category, status: fd.status, plan: fd.plan, fee: Number(fd.fee) || 0, pay_day: fd.pay_day ? Math.min(31, Math.max(1, Number(fd.pay_day))) : null, start_date: fd.start_date || null, owner_name: fd.owner_name.trim(), phone: fd.phone.trim(), memo: fd.memo.trim() };
      if (c) await DB().update('clients', c.id, row);
      else {
        let code; do { code = genCode(); } while (S.data.clients.some(x => x.code === code));
        const nc = await DB().insert('clients', { ...row, code });
        if (pre._lead) await DB().update('leads', pre._lead, { stage: '계약', memo: (pre.memo ? pre.memo + '\n' : '') + '고객사 등록 완료' });
        await loadAdmin(); render(); afterPop = () => { go('cli', nc && nc.id); toast('고객사가 추가되었습니다. 초대 링크를 보내세요.'); }; return;
      }
      await loadAdmin(); render(); toast('저장되었습니다.');
    } });
  ov.querySelector('#planSel').addEventListener('change', e => { const p = PLANS.find(x => x.n === e.target.value); if (p && p.fee) ov.querySelector('#feeIn').value = p.fee; });
}
function leadForm(l) {
  const v = Object.assign({ name: '', category: '학원', area: '원주 ', contact: '', stage: '발굴', next_action: '', next_date: '', memo: '' }, l || {});
  sheet(l ? '리드 수정' : '영업 리드 추가', `
    <div class="f"><label>상호 <span class="req">*</span></label><input class="in" name="name" value="${esc(v.name)}" required data-label="상호"></div>
    <div class="f2"><div class="f"><label>업종</label><select class="in" name="category">${opt(CATEGORIES, v.category)}</select></div>
      <div class="f"><label>단계</label><select class="in" name="stage">${opt(STAGES, v.stage)}</select></div></div>
    <div class="f2"><div class="f"><label>지역</label><input class="in" name="area" value="${esc(v.area || '')}"></div>
      <div class="f"><label>연락처</label><input class="in" name="contact" type="tel" inputmode="tel" value="${esc(v.contact || '')}"></div></div>
    <div class="f"><label>다음 할 일</label><input class="in" name="next_action" value="${esc(v.next_action || '')}" placeholder="예) 진단카드 들고 방문"></div>
    <div class="f"><label>날짜</label><input class="in" name="next_date" type="date" value="${esc(v.next_date || '')}"></div>
    <div class="f"><label>메모</label><textarea class="in" name="memo" placeholder="플레이스 진단 내용, 반응 등">${esc(v.memo || '')}</textarea></div>`,
    { extra: l ? `<button class="btn danger" type="button" id="leadDel">삭제</button>` : '', onOk: async fd => {
      const row = { name: fd.name.trim(), category: fd.category, stage: fd.stage, area: fd.area.trim(), contact: fd.contact.trim(), next_action: fd.next_action.trim(), next_date: fd.next_date || null, memo: fd.memo.trim() };
      if (l) await DB().update('leads', l.id, row); else await DB().insert('leads', row);
      await loadAdmin(); render(); toast('저장되었습니다.');
    } });
  const del = document.getElementById('leadDel');
  if (del) del.addEventListener('click', () => closeThen(async () => { if (await confirmBox(`'${l.name}' 리드를 삭제할까요?`, '삭제')) { await guard(() => DB().remove('leads', l.id), '삭제 중'); await refresh(true); } }));
}
function reportForm(cid, month) {
  const c = clientById(cid); if (!c) return;
  month = month || ymAdd(ymNow(), -1);
  const ex = S.data.reports.find(r => r.client_id === cid && r.month === month) || {};
  const prev = S.data.reports.find(r => r.client_id === cid && r.month === ymAdd(month, -1));
  const n = (k, label) => `<div class="f"><label>${label}</label><input class="in" name="${k}" type="number" inputmode="numeric" value="${esc(ex[k] ?? '')}" placeholder="${prev && prev[k] != null ? '전월 ' + num(prev[k]) : ''}"></div>`;
  const ov = sheet(`${c.name} 리포트`, `
    <div class="f"><label>대상 월</label><input class="in" name="month" type="month" id="repMonthIn" value="${month}"></div>
    <div class="f2">${n('place_views', '플레이스 조회수')}${n('saves', '저장 수')}</div>
    <div class="f2">${n('reviews', '신규 리뷰')}${n('posts', '게시물 수')}</div>
    ${n('insta_reach', '인스타 도달 (없으면 비움)')}
    <div class="f"><label>이번 달 한 일</label><textarea class="in" name="summary" placeholder="예) 신메뉴 소식 6건 게시, 대표사진 교체">${esc(ex.summary || '')}</textarea></div>
    <div class="f"><label>다음 달 계획</label><textarea class="in" name="next_plan">${esc(ex.next_plan || '')}</textarea></div>
    <label class="row small" style="gap:8px"><input type="checkbox" name="published" ${ex.published === false ? '' : 'checked'}> 사장님 앱에 공개</label>`,
    { onOk: async fd => {
      const iv = k => fd[k] === '' ? 0 : Number(fd[k]) || 0;
      await DB().saveReport({ client_id: cid, month: fd.month || month, place_views: iv('place_views'), saves: iv('saves'), reviews: iv('reviews'), posts: iv('posts'), insta_reach: iv('insta_reach'), summary: fd.summary.trim(), next_plan: fd.next_plan.trim(), published: !!fd.published });
      await loadAdmin(); render(); toast('리포트가 저장되었습니다.');
    } });
  ov.querySelector('#repMonthIn').addEventListener('change', e => { const m = e.target.value; if (m && m !== month && S.data.reports.find(r => r.client_id === cid && r.month === m)) closeThen(() => reportForm(cid, m)); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.ov,.viewer')) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'draftMsg') S.draft.message = e.target.value;
  if (e.target.id === 'clientQ') { S.clientQ = e.target.value; const q = S.clientQ.trim(); $('#clientList').innerHTML = clientListHtml(filterClients(q), q); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoIn') return;
  const files = [...e.target.files].slice(0, 20 - S.draft.files.length);
  if (!files.length) return;
  const max = isCloud() ? 1600 : 900, q = isCloud() ? 0.82 : 0.7;
  await guard(async () => {
    for (let i = 0; i < files.length; i++) { loading(true, `사진 준비 중 ${i + 1}/${files.length}`); const blob = await compress(files[i], max, q); S.draft.files.push({ blob, url: URL.createObjectURL(blob) }); }
  });
  loading(false); render();
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'codeForm') {
    e.preventDefault(); const code = new FormData(e.target).get('code').trim().toUpperCase();
    if (code.length < 4) { toast('고객 코드를 확인해주세요.'); return; }
    await startClient(code, true);
  }
  if (e.target.id === 'loginForm') {
    e.preventDefault(); const fd = new FormData(e.target);
    const ok = await guard(async () => { await Auth.signIn(fd.get('email').trim(), fd.get('pw')); S.role = 'admin'; LS.set('tga_role', { role: 'admin' }); await loadAdmin(); return true; }, '로그인 중');
    if (ok) { S.tab = 'home'; history.replaceState({ tab: 'home' }, ''); render(); }
  }
});
async function startClient(code, manual) {
  S.role = 'client'; S.code = code; S.preview = false;
  try { loading(true, '확인 중'); await loadClient(); LS.set('tga_role', { role: 'client', code }); S.tab = 'home'; history.replaceState({ tab: 'home' }, '', appUrl()); render(); }
  catch (e) { S.role = null; S.me = null; S.codeHint = code; toast(e.message); if (!manual) { S.tab = 'code'; history.replaceState({ tab: 'code' }, '', appUrl()); render(); } }
  finally { loading(false); }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (!S.role || S.tab === 'set') render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.role && !ovStack.length && S.tab !== 'send') refresh(true); });

/* ---------- boot ---------- */
(async function boot() {
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  const qp = new URLSearchParams(location.search);
  const qc = (qp.get('c') || '').trim().toUpperCase();
  const saved = LS.get('tga_role', null);
  history.replaceState({ tab: 'land' }, '');
  if (qc) return startClient(qc, false);
  if (saved && saved.role === 'client' && saved.code) return startClient(saved.code, false);
  if (saved && saved.role === 'admin' && (!isCloud() || Auth.s)) {
    S.role = 'admin'; S.tab = 'home'; history.replaceState({ tab: 'home' }, '');
    render(); await refresh(true); return;
  }
  S.tab = 'land'; render();
})();
</script>
</body>
</html>
